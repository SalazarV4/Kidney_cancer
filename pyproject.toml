    "seaborn (>=0.13.2,<0.14.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "python-box (>=7.3.2,<8.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "ensure (>=1.0.4,<2.0.0)",
    "joblib (>=1.5.1,<2.0.0)",
    "types-pyyaml (>=6.0.12.20250516,<7.0.0.0)",
